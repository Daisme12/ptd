services:
  mongodb:
    image: mongo:latest
    container_name: ptd_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptd_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_CONNECTION_STRING=mongodb://mongodb:27017/ptd
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: ptd_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo_data:
