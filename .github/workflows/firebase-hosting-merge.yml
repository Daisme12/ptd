name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > service-account.json
          node -e "
            const fs = require('fs');
            try {
              const content = fs.readFileSync('service-account.json', 'utf8').trim();
              console.log('File length:', content.length);
              if (content.length === 0) {
                console.log('WARNING: The secret is completely EMPTY!');
              } else {
                const data = JSON.parse(content);
                console.log('Keys in JSON:', Object.keys(data));
                console.log('Project ID in JSON:', data.project_id);
              }
            } catch (e) {
              console.error('Failed to parse JSON:', e.message);
            }
          "
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json
          npx -y firebase-tools@latest deploy --only hosting --project thinhphongdo-58625 --non-interactive



