name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build
        run: |
          # Write service account key to disk for Firestore connection
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > service-account.json
          
          # Build Frontend
          cd frontend
          npm install
          npm run build
          
          # Install backend dependencies and run static pre-rendering
          cd ../backend
          npm install
          node prerender.js

      - name: Deploy to Firebase Hosting
        run: |
          npx -y firebase-tools@latest deploy --only hosting --project thinhphongdo-58625 --non-interactive
