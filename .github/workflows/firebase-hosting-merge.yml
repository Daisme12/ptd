name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > service-account.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("service-account.json", "utf8"));
            if (data.private_key) {
              console.log("Key type:", typeof data.private_key);
              console.log("Key length:", data.private_key.length);
              const lines = data.private_key.split("\n");
              console.log("Number of lines:", lines.length);
              console.log("First line:", lines[0]);
              console.log("Last line:", lines[lines.length - 1] || lines[lines.length - 2]);
              console.log("Contains \\r:", data.private_key.includes("\r"));
              console.log("Contains literal \\\\n:", data.private_key.includes("\\n"));
              console.log("Raw char codes of first 30 chars:", Array.from(data.private_key.substring(0, 30)).map(c => c.charCodeAt(0)));
            } else {
              console.log("ERROR: private_key is missing in JSON!");
            }
          '
          npx -y firebase-tools@latest deploy --only hosting --project thinhphongdo-58625 --non-interactive --debug







